name: firmware
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host-side unit tests (pure logic)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I firmware/fertilizer_system tests/test_logic.cpp -o test_logic
          ./test_logic

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: blynk-only, blynk: 1, mqtt: 0, ds18b20: 0 }
          - { name: mqtt-only,  blynk: 0, mqtt: 1, ds18b20: 0 }
          - { name: everything, blynk: 1, mqtt: 1, ds18b20: 1 }
          - { name: no-network, blynk: 0, mqtt: 0, ds18b20: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@4.0.0
          arduino-cli lib install "Blynk@1.4.0" "PubSubClient" "ArduinoJson@7.4.3" "OneWire@2.3.8" "DallasTemperature@4.0.6"
      - name: Create config.h from the example
        working-directory: firmware/fertilizer_system
        run: |
          sed -e "s/#define USE_BLYNK   1/#define USE_BLYNK   ${{ matrix.blynk }}/" \
              -e "s/#define USE_MQTT    0/#define USE_MQTT    ${{ matrix.mqtt }}/" \
              -e "s/#define ENABLE_DS18B20 0/#define ENABLE_DS18B20 ${{ matrix.ds18b20 }}/" \
              config.h.example > config.h
      - name: Compile (${{ matrix.name }})
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings more firmware/fertilizer_system
