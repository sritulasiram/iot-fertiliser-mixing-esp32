<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">Fertiliser concentration adjustment</title><desc id="d">Percentage of the target ppm reached at 200, 400, 600 and 800 ppm: between 92.8 and 98.8 percent.</desc>
<style>
  :root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
          --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
            --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .t   { fill: var(--ink2); font-size: 12px; }
  .tm  { fill: var(--muted); font-size: 12px; }
  .ti  { fill: var(--ink);  font-size: 13px; }
  .val { fill: var(--ink);  font-size: 12px; font-weight: 600; }
  .grid{ stroke: var(--grid); stroke-width: 1; }
  .axis{ stroke: var(--axis); stroke-width: 1; }
  .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .l1  { stroke: var(--s1); stroke-width: 2; fill: none; }
  .f1  { fill: var(--s1); }
  .f2  { fill: var(--s2); }
  .dot1{ fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="640" height="380" fill="var(--surface)"/>
<line class="grid" x1="64" x2="616" y1="324.0" y2="324.0"/>
<text class="tm" x="56" y="328.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="616" y1="254.6" y2="254.6"/>
<text class="tm" x="56" y="258.6" text-anchor="end">25</text>
<line class="grid" x1="64" x2="616" y1="185.1" y2="185.1"/>
<text class="tm" x="56" y="189.1" text-anchor="end">50</text>
<line class="grid" x1="64" x2="616" y1="115.7" y2="115.7"/>
<text class="tm" x="56" y="119.7" text-anchor="end">75</text>
<line class="grid" x1="64" x2="616" y1="46.2" y2="46.2"/>
<text class="tm" x="56" y="50.2" text-anchor="end">100</text>
<line class="axis" x1="64" x2="616" y1="324" y2="324"/>
<text class="t" x="16" y="174" text-anchor="middle" transform="rotate(-90 16 174)">Target achieved (%)</text>
<path class="f1" d="M105.0,324.0 L105.0,61.3 Q105.0,57.3 109.0,57.3 L157.0,57.3 Q161.0,57.3 161.0,61.3 L161.0,324.0 Z"><title>Target 200 ppm: 96.0% achieved</title></path>
<text x="133.0" y="77.3" text-anchor="middle" style="fill:var(--surface);font-size:13px;font-weight:700">96%</text>
<text class="tm" x="133.0" y="342" text-anchor="middle">200</text>
<path class="f1" d="M243.0,324.0 L243.0,53.7 Q243.0,49.7 247.0,49.7 L295.0,49.7 Q299.0,49.7 299.0,53.7 L299.0,324.0 Z"><title>Target 400 ppm: 98.75% achieved</title></path>
<text x="271.0" y="69.7" text-anchor="middle" style="fill:var(--surface);font-size:13px;font-weight:700">98.75%</text>
<text class="tm" x="271.0" y="342" text-anchor="middle">400</text>
<path class="f1" d="M381.0,324.0 L381.0,70.1 Q381.0,66.1 385.0,66.1 L433.0,66.1 Q437.0,66.1 437.0,70.1 L437.0,324.0 Z"><title>Target 600 ppm: 92.83% achieved</title></path>
<text x="409.0" y="86.1" text-anchor="middle" style="fill:var(--surface);font-size:13px;font-weight:700">92.83%</text>
<text class="tm" x="409.0" y="342" text-anchor="middle">600</text>
<path class="f1" d="M519.0,324.0 L519.0,62.7 Q519.0,58.7 523.0,58.7 L571.0,58.7 Q575.0,58.7 575.0,62.7 L575.0,324.0 Z"><title>Target 800 ppm: 95.5% achieved</title></path>
<text x="547.0" y="78.7" text-anchor="middle" style="fill:var(--surface);font-size:13px;font-weight:700">95.5%</text>
<text class="tm" x="547.0" y="342" text-anchor="middle">800</text>
<line class="ref" x1="64" x2="616" y1="46.2" y2="46.2"/>
<text class="tm" x="70" y="40.2">100% = target reached</text>
<text class="t" x="340" y="368" text-anchor="middle">Target TDS (ppm)</text>
</svg>
