<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">Flow sensor deviation by target volume</title><desc id="d">Average deviation in millilitres for both flow sensors at 250, 500, 750 and 1000 ml; never more than about 22 ml.</desc>
<style>
  :root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
          --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
            --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .t   { fill: var(--ink2); font-size: 12px; }
  .tm  { fill: var(--muted); font-size: 12px; }
  .ti  { fill: var(--ink);  font-size: 13px; }
  .val { fill: var(--ink);  font-size: 12px; font-weight: 600; }
  .grid{ stroke: var(--grid); stroke-width: 1; }
  .axis{ stroke: var(--axis); stroke-width: 1; }
  .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .l1  { stroke: var(--s1); stroke-width: 2; fill: none; }
  .f1  { fill: var(--s1); }
  .f2  { fill: var(--s2); }
  .dot1{ fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="640" height="380" fill="var(--surface)"/>
<line class="grid" x1="64" x2="616" y1="324.0" y2="324.0"/>
<text class="tm" x="56" y="328.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="616" y1="264.0" y2="264.0"/>
<text class="tm" x="56" y="268.0" text-anchor="end">5</text>
<line class="grid" x1="64" x2="616" y1="204.0" y2="204.0"/>
<text class="tm" x="56" y="208.0" text-anchor="end">10</text>
<line class="grid" x1="64" x2="616" y1="144.0" y2="144.0"/>
<text class="tm" x="56" y="148.0" text-anchor="end">15</text>
<line class="grid" x1="64" x2="616" y1="84.0" y2="84.0"/>
<text class="tm" x="56" y="88.0" text-anchor="end">20</text>
<line class="grid" x1="64" x2="616" y1="24.0" y2="24.0"/>
<text class="tm" x="56" y="28.0" text-anchor="end">25</text>
<line class="axis" x1="64" x2="616" y1="324" y2="324"/>
<text class="t" x="16" y="174" text-anchor="middle" transform="rotate(-90 16 174)">Deviation from target (ml)</text>
<path class="f1" d="M100.0,324.0 L100.0,148.0 Q100.0,144.0 104.0,144.0 L128.0,144.0 Q132.0,144.0 132.0,148.0 L132.0,324.0 Z"><title>Flow sensor 1, target 250 ml: 15.0 ml deviation</title></path>
<text class="val" x="116.0" y="138.0" text-anchor="middle">15</text>
<path class="f2" d="M134.0,324.0 L134.0,168.4 Q134.0,164.4 138.0,164.4 L162.0,164.4 Q166.0,164.4 166.0,168.4 L166.0,324.0 Z"><title>Flow sensor 2, target 250 ml: 13.3 ml deviation</title></path>
<text class="val" x="150.0" y="158.4" text-anchor="middle">13.3</text>
<text class="tm" x="133.0" y="342" text-anchor="middle">250</text>
<path class="f1" d="M238.0,324.0 L238.0,67.6 Q238.0,63.6 242.0,63.6 L266.0,63.6 Q270.0,63.6 270.0,67.6 L270.0,324.0 Z"><title>Flow sensor 1, target 500 ml: 21.7 ml deviation</title></path>
<text class="val" x="254.0" y="57.6" text-anchor="middle">21.7</text>
<path class="f2" d="M272.0,324.0 L272.0,307.6 Q272.0,303.6 276.0,303.6 L300.0,303.6 Q304.0,303.6 304.0,307.6 L304.0,324.0 Z"><title>Flow sensor 2, target 500 ml: 1.7 ml deviation</title></path>
<text class="val" x="288.0" y="297.6" text-anchor="middle">1.7</text>
<text class="tm" x="271.0" y="342" text-anchor="middle">500</text>
<path class="f1" d="M376.0,324.0 L376.0,287.2 Q376.0,283.2 380.0,283.2 L404.0,283.2 Q408.0,283.2 408.0,287.2 L408.0,324.0 Z"><title>Flow sensor 1, target 750 ml: 3.4 ml deviation</title></path>
<text class="val" x="392.0" y="277.2" text-anchor="middle">3.4</text>
