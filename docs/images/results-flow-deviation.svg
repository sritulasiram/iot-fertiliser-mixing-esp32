<text class="val" x="564.0" y="98.4" text-anchor="middle">18.3</text>
<text class="tm" x="547.0" y="342" text-anchor="middle">1000</text>
<text class="t" x="340" y="368" text-anchor="middle">Target volume (ml)</text>
<rect class="f1" x="366" y="26" width="12" height="12" rx="2"/><text class="t" x="384" y="36">Flow sensor 1 (4.25 ml/pulse)</text>
<rect class="f2" x="366" y="46" width="12" height="12" rx="2"/><text class="t" x="384" y="56">Flow sensor 2 (5.25 ml/pulse)</text>
</svg>
