<text class="val" x="426.0" y="237.6" text-anchor="middle">6.7</text>
<text class="tm" x="409.0" y="342" text-anchor="middle">750</text>
<path class="f1" d="M514.0,324.0 L514.0,268.0 Q514.0,264.0 518.0,264.0 L542.0,264.0 Q546.0,264.0 546.0,268.0 L546.0,324.0 Z"><title>Flow sensor 1, target 1000 ml: 5.0 ml deviation</title></path>
<text class="val" x="530.0" y="258.0" text-anchor="middle">5</text>
