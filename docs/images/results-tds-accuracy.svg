<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">TDS sensor against calibrated meter</title><desc id="d">Four solutions from 235 to 898 ppm; the sensor readings sit on the line of perfect agreement, within 4 ppm.</desc>
<style>
  :root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
          --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
            --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .t   { fill: var(--ink2); font-size: 12px; }
  .tm  { fill: var(--muted); font-size: 12px; }
  .ti  { fill: var(--ink);  font-size: 13px; }
  .val { fill: var(--ink);  font-size: 12px; font-weight: 600; }
  .grid{ stroke: var(--grid); stroke-width: 1; }
  .axis{ stroke: var(--axis); stroke-width: 1; }
  .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .l1  { stroke: var(--s1); stroke-width: 2; fill: none; }
  .f1  { fill: var(--s1); }
  .f2  { fill: var(--s2); }
  .dot1{ fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="640" height="380" fill="var(--surface)"/>
<line class="grid" x1="64" x2="490" y1="324.0" y2="324.0"/>
<text class="tm" x="56" y="328.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="490" y1="249.0" y2="249.0"/>
<text class="tm" x="56" y="253.0" text-anchor="end">250</text>
<line class="grid" x1="64" x2="490" y1="174.0" y2="174.0"/>
<text class="tm" x="56" y="178.0" text-anchor="end">500</text>
<line class="grid" x1="64" x2="490" y1="99.0" y2="99.0"/>
<text class="tm" x="56" y="103.0" text-anchor="end">750</text>
<line class="grid" x1="64" x2="490" y1="24.0" y2="24.0"/>
<text class="tm" x="56" y="28.0" text-anchor="end">1000</text>
<line class="axis" x1="64" x2="490" y1="324" y2="324"/>
<text class="t" x="16" y="174" text-anchor="middle" transform="rotate(-90 16 174)">TDS sensor reading (ppm)</text>
<text class="tm" x="64.0" y="342" text-anchor="middle">0</text>
<text class="tm" x="170.5" y="342" text-anchor="middle">250</text>
<text class="tm" x="277.0" y="342" text-anchor="middle">500</text>
<text class="tm" x="383.5" y="342" text-anchor="middle">750</text>
<text class="tm" x="490.0" y="342" text-anchor="middle">1000</text>
<text class="t" x="277" y="368" text-anchor="middle">Calibrated TDS meter (ppm)</text>
<line class="ref" x1="64.0" y1="324.0" x2="490.0" y2="24.0"/>
<text class="tm" x="286" y="279">dashed line = perfect agreement</text>
<circle class="dot1" cx="446.5" cy="55.2" r="5"><title>Concentrated: meter 898 ppm, sensor 896.0 ppm</title></circle>
<text class="t" x="456.5" y="59.2">Concentrated (896)</text>
<circle class="dot1" cx="347.7" cy="124.0" r="5"><title>Diluted 1: meter 666 ppm, sensor 666.7 ppm</title></circle>
<text class="t" x="357.7" y="128.0">Diluted 1 (667)</text>
<circle class="dot1" cx="259.1" cy="186.5" r="5"><title>Diluted 2: meter 458 ppm, sensor 458.3 ppm</title></circle>
<text class="t" x="269.1" y="190.5">Diluted 2 (458)</text>
<circle class="dot1" cx="164.1" cy="254.2" r="5"><title>Diluted 3: meter 235 ppm, sensor 232.7 ppm</title></circle>
<text class="t" x="174.1" y="258.2">Diluted 3 (233)</text>
</svg>
